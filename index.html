<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2f2f7'/%3E%3Crect x='6' y='6' width='20' height='20' rx='3' fill='none' stroke='%23c7c7cc' stroke-width='1.5'/%3E%3Cpath d='M9.5 11.5l2 2 3.5-4' stroke='%232ca84a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cline x1='17' y1='12' x2='23' y2='12' stroke='%238e8e93' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M9.5 18.5l2 2 3.5-4' stroke='%232a97ab' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cline x1='17' y1='19' x2='23' y2='19' stroke='%238e8e93' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='9.5' y1='25' x2='16' y2='25' stroke='%23c7c7cc' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --fill: #e9e9ee;
    --line: #e3e3e8;
    --text: #1c1c1e;
    --text-dim: #6e6e73;
    --text-faint: #8e8e93;

    --accent: #2ca84a;
    --accent-soft: #e0f3e3;
    --accent-ink: #1b6b30;
    --teal: #2a97ab;
    --teal-soft: #dcf1f4;
    --teal-ink: #106674;
    --plum: #9a4fce;
    --plum-soft: #f0e3f8;
    --plum-ink: #6c2f96;
    --danger: #ff3b30;

    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

    --shadow: 0 1px 1px rgba(0,0,0,0.03), 0 6px 16px rgba(28,28,30,0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --surface: #1c1c1e;
      --fill: #2c2c2e;
      --line: #38383a;
      --text: #f2f2f7;
      --text-dim: #ababaf;
      --text-faint: #8e8e93;

      --accent: #32d74b;
      --accent-soft: #16281a;
      --accent-ink: #86e69b;
      --teal: #40cbe0;
      --teal-soft: #10262a;
      --teal-ink: #8fe0ec;
      --plum: #bf5af2;
      --plum-soft: #2a1c33;
      --plum-ink: #dcaaf5;
      --danger: #ff453a;

      --shadow: 0 1px 1px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #1c1c1e;
    --fill: #2c2c2e;
    --line: #38383a;
    --text: #f2f2f7;
    --text-dim: #ababaf;
    --text-faint: #8e8e93;

    --accent: #32d74b;
    --accent-soft: #16281a;
    --accent-ink: #86e69b;
    --teal: #40cbe0;
    --teal-soft: #10262a;
    --teal-ink: #8fe0ec;
    --plum: #bf5af2;
    --plum-soft: #2a1c33;
    --plum-ink: #dcaaf5;
    --danger: #ff453a;

    --shadow: 0 1px 1px rgba(0,0,0,0.4), 0 8px 20px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
  }

  #app {
    max-width: 560px;
    margin: 0 auto;
    padding: 18px 16px 80px;
  }

  header {
    margin-bottom: 18px;
  }

  header .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand { display: flex; align-items: center; gap: 8px; }

  .brand .tick {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .brand h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--text);
  }

  .theme-toggle {
    display: flex;
    gap: 2px;
    background: var(--fill);
    border-radius: 8px;
    padding: 2px;
  }
  .theme-toggle button {
    border: none;
    background: transparent;
    color: var(--text-dim);
    padding: 5px 10px;
    border-radius: 6px;
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .theme-toggle button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

  header .sub-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 10px;
  }

  header .count { font-size: 12px; color: var(--text-faint); line-height: 1.5; }

  .signout {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-faint);
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .signout:hover { color: var(--danger); }

  /* ---- Segmented control (tabs) ---- */
  .tabs {
    display: flex;
    gap: 2px;
    background: var(--fill);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 24px;
  }

  .tab {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 6px;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
  }

  .tab.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2.5px rgba(0,0,0,0.16); }

  .view { display: none; }
  .view.active { display: block; }

  .section-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 26px 4px 8px;
  }

  .section-label:first-of-type { margin-top: 0; }

  /* ---- Today / focus summary (on Today tab) ---- */
  .focus-card {
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .focus-card .band {
    background: var(--accent-soft);
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
  }

  .focus-card .body { padding: 16px 18px 18px; }

  .focus-tag {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--accent-ink);
  }

  .focus-card h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; color: var(--text); line-height: 1.25; letter-spacing: -0.01em; }
  .focus-card .notes { font-size: 14px; color: var(--text-dim); line-height: 1.5; margin: 6px 0 14px; }

  .deadline {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .focus-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }

  button { font-family: var(--font); cursor: pointer; border: none; outline: none; }

  .btn {
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 10px;
    background: var(--fill);
    color: var(--text);
  }

  .btn.primary { background: var(--accent); color: #fff; }
  .btn.tinted { background: var(--accent-soft); color: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--danger); padding: 9px 4px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

  /* ---- Grouped list rows (queue / backlog / todos / parking) ---- */
  .ios-group {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }

  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 15.5px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .row-notes { font-size: 13px; color: var(--text-dim); line-height: 1.4; }
  .row-deadline { font-size: 12px; font-weight: 600; color: var(--teal-ink); margin-top: 4px; display: inline-block; }

  .row-controls { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .row-controls button { background: transparent; color: var(--text-faint); padding: 3px 6px; border-radius: 6px; font-size: 13px; line-height: 1; }
  .row-controls button:active { background: var(--fill); }

  .row-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .row-actions button {
    font-size: 12px;
    font-weight: 600;
    background: var(--fill);
    color: var(--text-dim);
    padding: 5px 10px;
    border-radius: 8px;
  }
  .row-actions button.destructive { background: transparent; color: var(--danger); padding: 5px 2px; }

  .backlog-row .row-title { color: var(--text-dim); }

  /* ---- To-dos ---- */
  .todo-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--text-faint);
    background: transparent;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 13px;
  }

  .todo-check.checked { background: var(--teal); border-color: var(--teal); color: #fff; }

  .row-title.done { color: var(--text-faint); text-decoration: line-through; font-weight: 500; }
  .row-meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }

  .todo-due {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--plum-ink);
    background: var(--plum-soft);
    padding: 2px 8px;
    border-radius: 12px;
  }

  .todo-today-badge {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 12px;
  }

  .todo-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .todo-actions button {
    background: transparent;
    color: var(--text-faint);
    padding: 4px 6px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .todo-actions button:active { background: var(--fill); }
  .todo-actions button.star.active { color: var(--accent); }
  .todo-actions button.del:active { color: var(--danger); }

  /* ---- Parking lot ---- */
  .park-form { display: flex; gap: 8px; margin-bottom: 14px; }
  .park-form input {
    flex: 1;
    background: var(--surface);
    border: none;
    box-shadow: var(--shadow);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-family: var(--font);
  }
  .park-form input::placeholder { color: var(--text-faint); }

  .park-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--plum); flex-shrink: 0; margin-top: 5px; }
  .park-title { flex: 1; font-size: 15px; color: var(--text); }
  .park-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .park-actions button {
    font-size: 12px;
    font-weight: 600;
    background: var(--fill);
    color: var(--text-dim);
    padding: 5px 10px;
    border-radius: 8px;
  }
  .park-actions button.del { background: transparent; color: var(--danger); padding: 5px 2px; }

  .empty {
    font-size: 14px;
    color: var(--text-faint);
    padding: 20px 16px;
    text-align: center;
    background: var(--surface);
    border-radius: 14px;
  }

  /* ---- Add forms ---- */
  .add-form { background: var(--surface); border-radius: 14px; padding: 14px; margin-top: 8px; box-shadow: var(--shadow); }
  .add-form.hidden { display: none; }
  .add-form input, .add-form textarea {
    width: 100%;
    background: var(--fill);
    border: none;
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-family: var(--font);
    margin-bottom: 8px;
  }
  .add-form textarea { resize: vertical; min-height: 50px; }
  .add-form .row-fields { display: flex; gap: 8px; }
  .add-form .row-fields > * { flex: 1; }
  .add-form .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .add-form label.check-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-dim); margin-bottom: 8px; }

  .add-toggle {
    width: 100%;
    background: var(--surface);
    box-shadow: var(--shadow);
    border: none;
    color: var(--accent);
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 10px;
  }
  .add-toggle.hidden { display: none; }

  .status-msg { font-size: 12px; color: var(--text-faint); text-align: center; margin-top: 30px; }

  select {
    background: var(--fill);
    border: none;
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-family: var(--font);
  }

  /* ---- Link pills ---- */
  .link-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 4px;
  }

  .link-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--teal-ink);
    background: var(--teal-soft);
    padding: 4px 10px;
    border-radius: 20px;
    text-decoration: none;
    max-width: 100%;
  }

  .link-pill span.lbl {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 160px;
  }

  /* ---- Link editor (inside add/edit forms) ---- */
  .link-editor { margin-bottom: 8px; }

  .link-editor-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .link-editor-list { margin-bottom: 6px; }

  .link-editor-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--fill);
    border-radius: 8px;
    padding: 7px 9px;
    margin-bottom: 5px;
  }

  .link-editor-item .li-label { font-size: 13px; color: var(--text); font-weight: 600; flex-shrink: 0; }
  .link-editor-item .li-url { font-size: 12px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .link-editor-item button { background: transparent; color: var(--text-faint); font-size: 13px; padding: 2px 6px; border-radius: 6px; }

  .link-editor-add { display: flex; gap: 6px; }
  .link-editor-add input { margin-bottom: 0; }
  .link-editor-add input[data-link-field="label"] { flex: 0 0 110px; }
  .link-editor-add input[data-link-field="url"] { flex: 1; }
  .link-editor-add button {
    flex-shrink: 0;
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 600;
  }

  /* ---- Auth gate ---- */
  #authGate {
    max-width: 340px;
    margin: 20vh auto 0;
    padding: 0 20px;
    text-align: center;
  }
  #authGate h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
  }
  #authGate input {
    width: 100%;
    background: var(--surface);
    box-shadow: var(--shadow);
    border: none;
    color: var(--text);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 15px;
    font-family: var(--font);
    margin-bottom: 10px;
    text-align: center;
  }
  #authGate .btn { width: 100%; padding: 11px; border-radius: 12px; }
  #authGate .auth-msg { font-size: 12.5px; color: var(--text-faint); margin-top: 14px; min-height: 1.4em; }
  .hidden { display: none !important; }

  /* Mobile browsers auto-zoom on focus into any text input smaller than
     16px, then require a manual zoom back out. Bumping form field text
     to 16px on narrow screens avoids triggering that zoom in the first
     place, without touching desktop sizing. */
  @media (max-width: 600px) {
    input, textarea, select {
      font-size: 16px !important;
    }
  }
</style>
</head>
<body>

<div id="authGate">
  <h1>Queue</h1>
  <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
  <button class="btn primary" id="authSend">Send magic link</button>
  <div class="auth-msg" id="authMsg"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="top-row">
      <div class="brand">
        <span class="tick"></span>
        <h1>Queue</h1>
      </div>
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button id="themeLight">Light</button>
        <button id="themeDark">Dark</button>
      </div>
    </div>
    <div class="sub-row">
      <span class="count" id="headerCount">—</span>
      <button class="signout" id="signOutBtn">Sign out</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="today">Today</button>
    <button class="tab" data-view="projects">Projects</button>
    <button class="tab" data-view="todos">To-Dos</button>
    <button class="tab" data-view="parking">Parking</button>
  </div>

  <!-- TODAY VIEW -->
  <div class="view active" id="view-today">
    <div class="section-label">Top Priority Project</div>
    <div id="todayFocusZone"></div>

    <div class="section-label">Flagged For Today</div>
    <div id="todayTodoZone"></div>
  </div>

  <!-- PROJECTS VIEW -->
  <div class="view" id="view-projects">
    <div class="section-label">Up Now</div>
    <div id="focusZone"></div>

    <div class="section-label">On Deck</div>
    <div id="queueZone"></div>

    <button class="add-toggle" id="addProjectToggle">+ Add a project</button>
    <div class="add-form hidden" id="addProjectForm">
      <input type="text" id="newTitle" placeholder="Project name">
      <textarea id="newNotes" placeholder="Notes (optional)"></textarea>
      <div class="row-fields">
        <input type="text" id="newDeadline" placeholder="Deadline (optional, e.g. Aug 25)">
        <select id="newStatus">
          <option value="queued">Add to queue</option>
          <option value="backlog">Add to backlog</option>
        </select>
      </div>
      <div class="link-editor">
        <div class="link-editor-label">Links</div>
        <div class="link-editor-list" id="newProjectLinksList"></div>
        <div class="link-editor-add">
          <input type="text" id="newLinkLabel" placeholder="Label (e.g. Sheet)">
          <input type="text" id="newLinkUrl" placeholder="https://...">
          <button id="addNewLink" type="button">+ Add</button>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn tinted" id="cancelAddProject">Cancel</button>
        <button class="btn primary" id="saveAddProject">Add project</button>
      </div>
    </div>

    <div class="section-label">Backlog</div>
    <div id="backlogZone"></div>
  </div>

  <!-- TODOS VIEW -->
  <div class="view" id="view-todos">
    <div class="section-label">Open</div>
    <div id="todoOpenZone"></div>

    <button class="add-toggle" id="addTodoToggle">+ Add a to-do</button>
    <div class="add-form hidden" id="addTodoForm">
      <input type="text" id="newTodoTitle" placeholder="e.g. Mow the grass, go to the DMV">
      <div class="row-fields">
        <input type="text" id="newTodoDue" placeholder="Due (optional, e.g. Fri)">
      </div>
      <label class="check-row"><input type="checkbox" id="newTodoToday"> Flag as today</label>
      <div class="form-actions">
        <button class="btn tinted" id="cancelAddTodo">Cancel</button>
        <button class="btn primary" id="saveAddTodo">Add to-do</button>
      </div>
    </div>

    <div class="section-label">Done</div>
    <div id="todoDoneZone"></div>
  </div>

  <!-- PARKING LOT VIEW -->
  <div class="view" id="view-parking">
    <div class="section-label">Capture a new idea</div>
    <div class="park-form">
      <input type="text" id="parkInput" placeholder="Jot it down before it slips away...">
      <button class="btn primary" id="parkAdd">Add</button>
    </div>
    <div id="parkZone"></div>
  </div>

  <div class="status-msg" id="statusMsg">syncing...</div>
</div>

<script>
/* ============================================================
   CONFIG — fill these in from Supabase → Settings → API
   ============================================================ */
const SUPABASE_URL = 'https://upzldccrardvdyeympkk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MuxZe1AlxAIRPQt9aUZOBg_GlQI8TOs';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = { projects: [], todos: [], parkingLot: [] };
let loaded = false;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function setStatus(text) {
  document.getElementById('statusMsg').textContent = text;
}

function setStatusError(prefix, err) {
  const msg = (err && err.message) ? err.message : (typeof err === 'string' ? err : JSON.stringify(err));
  document.getElementById('statusMsg').innerHTML =
    `${escapeHtml(prefix)}: ${escapeHtml(msg)} — <button id="retryLoadBtn" style="background:transparent;border:none;color:var(--accent);font-size:12px;font-weight:600;">retry</button>`;
  const retryBtn = document.getElementById('retryLoadBtn');
  if (retryBtn) retryBtn.addEventListener('click', () => { loadAll().then(render); });
}

function nextOrder(list, status) {
  const items = status === undefined ? list : list.filter(p => p.status === status);
  return items.length ? Math.max(...items.map(p => p.order)) + 1 : 0;
}

/* ---- Theme (light/dark, persisted) ---- */

function applyTheme(mode) {
  if (mode) {
    document.documentElement.setAttribute('data-theme', mode);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  document.getElementById('themeLight').classList.toggle('active', mode === 'light');
  document.getElementById('themeDark').classList.toggle('active', mode === 'dark');
}

function initTheme() {
  const saved = localStorage.getItem('queue-theme');
  applyTheme(saved || null);
}

document.getElementById('themeLight').addEventListener('click', () => {
  localStorage.setItem('queue-theme', 'light');
  applyTheme('light');
});
document.getElementById('themeDark').addEventListener('click', () => {
  localStorage.setItem('queue-theme', 'dark');
  applyTheme('dark');
});

initTheme();

/* ---- Data layer (Supabase) ---- */

async function loadAll() {
  const [projectsRes, linksRes, todosRes, parkRes] = await Promise.all([
    supabaseClient.from('projects').select('*').order('order_index'),
    supabaseClient.from('project_links').select('*').order('order_index'),
    supabaseClient.from('todos').select('*').order('order_index'),
    supabaseClient.from('parking_lot').select('*').order('created_at')
  ]);
  for (const r of [projectsRes, linksRes, todosRes, parkRes]) {
    if (r.error) throw r.error;
  }

  const linksByProject = {};
  linksRes.data.forEach(l => {
    (linksByProject[l.project_id] ||= []).push({ id: l.id, label: l.label, url: l.url });
  });

  state = {
    projects: projectsRes.data.map(p => ({
      id: p.id, title: p.title, notes: p.notes || '', deadline: p.deadline || '',
      status: p.status, order: p.order_index, links: linksByProject[p.id] || []
    })),
    todos: todosRes.data.map(t => ({
      id: t.id, title: t.title, due: t.due || '', today: t.today, done: t.done, order: t.order_index
    })),
    parkingLot: parkRes.data.map(p => ({ id: p.id, title: p.title, addedDate: p.created_at }))
  };
  loaded = true;
  setStatus(`synced · ${new Date().toLocaleTimeString()}`);
}

async function dbInsertProject(p) {
  const { data, error } = await supabaseClient.from('projects').insert({
    title: p.title, notes: p.notes, deadline: p.deadline, status: p.status, order_index: p.order
  }).select().single();
  if (error) throw error;
  return data.id;
}
async function dbUpdateProject(p) {
  const { error } = await supabaseClient.from('projects').update({
    title: p.title, notes: p.notes, deadline: p.deadline, status: p.status, order_index: p.order
  }).eq('id', p.id);
  if (error) throw error;
}
async function dbDeleteProject(id) {
  const { error } = await supabaseClient.from('projects').delete().eq('id', id);
  if (error) throw error;
}
async function dbInsertLink(projectId, link) {
  const { data, error } = await supabaseClient.from('project_links').insert({
    project_id: projectId, label: link.label, url: link.url
  }).select().single();
  if (error) throw error;
  return data.id;
}
async function dbDeleteLink(id) {
  const { error } = await supabaseClient.from('project_links').delete().eq('id', id);
  if (error) throw error;
}

async function dbInsertTodo(t) {
  const { data, error } = await supabaseClient.from('todos').insert({
    title: t.title, due: t.due, today: t.today, done: t.done, order_index: t.order
  }).select().single();
  if (error) throw error;
  return data.id;
}
async function dbUpdateTodo(t) {
  const { error } = await supabaseClient.from('todos').update({
    title: t.title, due: t.due, today: t.today, done: t.done, order_index: t.order
  }).eq('id', t.id);
  if (error) throw error;
}
async function dbDeleteTodo(id) {
  const { error } = await supabaseClient.from('todos').delete().eq('id', id);
  if (error) throw error;
}

async function dbInsertPark(title) {
  const { data, error } = await supabaseClient.from('parking_lot').insert({ title }).select().single();
  if (error) throw error;
  return { id: data.id, addedDate: data.created_at };
}
async function dbUpdatePark(p) {
  const { error } = await supabaseClient.from('parking_lot').update({ title: p.title }).eq('id', p.id);
  if (error) throw error;
}
async function dbDeletePark(id) {
  const { error } = await supabaseClient.from('parking_lot').delete().eq('id', id);
  if (error) throw error;
}

/* ---- Rendering ---- */

let editing = null; // { type: 'project' | 'todo' | 'park', id: string }
let editingLinksTemp = []; // working copy of links while editing a project
let pendingNewLinks = []; // working copy of links while composing a new project

function isEditing(type, id) {
  return editing && editing.type === type && editing.id === id;
}

function linkEditorHtml(links, addAction, removeAction) {
  return `
    <div class="link-editor">
      <div class="link-editor-label">Links</div>
      <div class="link-editor-list">
        ${links.length === 0 ? '' : links.map((l, i) => `
          <div class="link-editor-item">
            <span class="li-label">${escapeHtml(l.label)}</span>
            <span class="li-url">${escapeHtml(l.url)}</span>
            <button data-action="${removeAction}" data-index="${i}">✕</button>
          </div>
        `).join('')}
      </div>
      <div class="link-editor-add">
        <input type="text" data-link-field="label" placeholder="Label (e.g. Sheet)">
        <input type="text" data-link-field="url" placeholder="https://...">
        <button data-action="${addAction}">+ Add</button>
      </div>
    </div>
  `;
}

function linkPillsHtml(links) {
  if (!links || links.length === 0) return '';
  return `<div class="link-row">${links.map(l => `<a class="link-pill" href="${escapeHtml(l.url)}" target="_blank" rel="noopener noreferrer">↗ <span class="lbl">${escapeHtml(l.label)}</span></a>`).join('')}</div>`;
}

function projectEditFormHtml(p) {
  return `
    <div class="add-form" style="margin-top:0;">
      <input type="text" data-edit-field="title" value="${escapeHtml(p.title)}" placeholder="Project name">
      <textarea data-edit-field="notes" placeholder="Notes (optional)">${escapeHtml(p.notes || '')}</textarea>
      <input type="text" data-edit-field="deadline" value="${escapeHtml(p.deadline || '')}" placeholder="Deadline (optional)">
      ${linkEditorHtml(editingLinksTemp, 'add-edit-link', 'remove-edit-link')}
      <div class="form-actions">
        <button class="btn tinted" data-action="cancel-edit">Cancel</button>
        <button class="btn primary" data-action="save-edit-project" data-id="${p.id}">Save</button>
      </div>
    </div>
  `;
}

function todoEditFormHtml(t) {
  return `
    <div class="add-form" style="margin-top:0;">
      <input type="text" data-edit-field="title" value="${escapeHtml(t.title)}" placeholder="To-do">
      <input type="text" data-edit-field="due" value="${escapeHtml(t.due || '')}" placeholder="Due (optional)">
      <label class="check-row"><input type="checkbox" data-edit-field="today" ${t.today ? 'checked' : ''}> Flag as today</label>
      <div class="form-actions">
        <button class="btn tinted" data-action="cancel-edit">Cancel</button>
        <button class="btn primary" data-action="save-edit-todo" data-id="${t.id}">Save</button>
      </div>
    </div>
  `;
}

function parkEditFormHtml(p) {
  return `
    <div class="add-form" style="margin-top:0; flex:1;">
      <input type="text" data-edit-field="title" value="${escapeHtml(p.title)}" placeholder="Idea">
      <div class="form-actions">
        <button class="btn tinted" data-action="cancel-edit">Cancel</button>
        <button class="btn primary" data-action="save-edit-park" data-id="${p.id}">Save</button>
      </div>
    </div>
  `;
}

function render() {
  if (!loaded) return;

  const queued = state.projects.filter(p => p.status === 'queued').sort((a,b) => a.order - b.order);
  const backlog = state.projects.filter(p => p.status === 'backlog').sort((a,b) => a.order - b.order);
  const openTodos = state.todos.filter(t => !t.done).sort((a,b) => (b.today - a.today) || (a.order - b.order));
  const doneTodos = state.todos.filter(t => t.done);
  const todayTodos = openTodos.filter(t => t.today);

  document.getElementById('headerCount').textContent =
    `${queued.length} queued · ${backlog.length} backlog · ${openTodos.length} open · ${state.parkingLot.length} parked`;

  renderTodayView(queued, todayTodos);
  renderProjectsView(queued, backlog);
  renderTodosView(openTodos, doneTodos);
  renderParkingView();
}

function projectCardHtml(p, tagLabel) {
  if (isEditing('project', p.id)) return projectEditFormHtml(p);
  return `
    <div class="focus-card">
      <div class="band"><span class="focus-tag">${tagLabel}</span></div>
      <div class="body">
        <h2>${escapeHtml(p.title)}</h2>
        ${p.deadline ? `<div class="deadline">⏱ ${escapeHtml(p.deadline)}</div>` : ''}
        ${p.notes ? `<div class="notes">${escapeHtml(p.notes)}</div>` : ''}
        ${linkPillsHtml(p.links)}
        <div class="focus-actions">
          <button class="btn primary" data-action="done" data-id="${p.id}">Mark done</button>
          <button class="btn tinted" data-action="backlog" data-id="${p.id}">Move to backlog</button>
          <button class="btn tinted" data-action="edit-project" data-id="${p.id}">Edit</button>
          <button class="btn ghost" data-action="delete" data-id="${p.id}">Remove</button>
        </div>
      </div>
    </div>
  `;
}

function todoRowHtml(t) {
  if (isEditing('todo', t.id)) return todoEditFormHtml(t);
  return `
    <div class="row">
      <button class="todo-check ${t.done ? 'checked' : ''}" data-action="toggle-todo" data-id="${t.id}">${t.done ? '✓' : ''}</button>
      <div class="row-main">
        <div class="row-title ${t.done ? 'done' : ''}">${escapeHtml(t.title)}</div>
        <div class="row-meta">
          ${t.today && !t.done ? `<span class="todo-today-badge">Today</span>` : ''}
          ${t.due ? `<span class="todo-due">${escapeHtml(t.due)}</span>` : ''}
        </div>
      </div>
      <div class="todo-actions">
        ${!t.done ? `<button class="star ${t.today ? 'active' : ''}" data-action="star-todo" data-id="${t.id}" title="Flag for today">★</button>` : ''}
        <button data-action="edit-todo" data-id="${t.id}">Edit</button>
        <button class="del" data-action="delete-todo" data-id="${t.id}">✕</button>
      </div>
    </div>
  `;
}

function renderTodayView(queued, todayTodos) {
  const focusZone = document.getElementById('todayFocusZone');
  const todoZone = document.getElementById('todayTodoZone');

  if (queued.length === 0) {
    focusZone.innerHTML = `<div class="empty">Nothing queued. Check the Projects tab.</div>`;
  } else {
    focusZone.innerHTML = projectCardHtml(queued[0], 'Priority 1');
  }

  if (todayTodos.length === 0) {
    todoZone.innerHTML = `<div class="empty">No to-dos flagged for today. Star one from the To-Dos tab.</div>`;
  } else {
    todoZone.innerHTML = `<div class="ios-group">${todayTodos.map(todoRowHtml).join('')}</div>`;
  }
}

function renderProjectsView(queued, backlog) {
  const focusZone = document.getElementById('focusZone');
  const queueZone = document.getElementById('queueZone');
  const backlogZone = document.getElementById('backlogZone');

  if (queued.length === 0) {
    focusZone.innerHTML = `<div class="empty">Nothing queued. Add a project below or promote one from the backlog.</div>`;
  } else {
    focusZone.innerHTML = projectCardHtml(queued[0], 'Priority 1');
  }

  const rest = queued.slice(1);
  if (rest.length === 0) {
    queueZone.innerHTML = `<div class="empty">Nothing else on deck.</div>`;
  } else {
    const rows = rest.map((p, i) => {
      if (isEditing('project', p.id)) return projectEditFormHtml(p);
      return `
      <div class="row">
        <div class="row-main">
          <div class="row-title">${escapeHtml(p.title)}</div>
          ${p.notes ? `<div class="row-notes">${escapeHtml(p.notes)}</div>` : ''}
          ${p.deadline ? `<div class="row-deadline">⏱ ${escapeHtml(p.deadline)}</div>` : ''}
          ${linkPillsHtml(p.links)}
          <div class="row-actions">
            <button data-action="backlog" data-id="${p.id}">Backlog</button>
            <button data-action="edit-project" data-id="${p.id}">Edit</button>
            <button class="destructive" data-action="delete" data-id="${p.id}">Remove</button>
          </div>
        </div>
        <div class="row-controls">
          <button data-action="up" data-id="${p.id}" title="Move up">▲</button>
          <button data-action="down" data-id="${p.id}" title="Move down">▼</button>
        </div>
      </div>
    `;
    }).join('');
    queueZone.innerHTML = `<div class="ios-group">${rows}</div>`;
  }

  if (backlog.length === 0) {
    backlogZone.innerHTML = `<div class="empty">Backlog is empty.</div>`;
  } else {
    const rows = backlog.map(p => {
      if (isEditing('project', p.id)) return projectEditFormHtml(p);
      return `
      <div class="row backlog-row">
        <div class="row-main">
          <div class="row-title">${escapeHtml(p.title)}</div>
          ${p.notes ? `<div class="row-notes">${escapeHtml(p.notes)}</div>` : ''}
          ${linkPillsHtml(p.links)}
          <div class="row-actions">
            <button data-action="queue" data-id="${p.id}">Promote to queue</button>
            <button data-action="edit-project" data-id="${p.id}">Edit</button>
            <button class="destructive" data-action="delete" data-id="${p.id}">Remove</button>
          </div>
        </div>
      </div>
    `;
    }).join('');
    backlogZone.innerHTML = `<div class="ios-group">${rows}</div>`;
  }
}

function renderTodosView(openTodos, doneTodos) {
  const openZone = document.getElementById('todoOpenZone');
  const doneZone = document.getElementById('todoDoneZone');

  openZone.innerHTML = openTodos.length === 0
    ? `<div class="empty">Nothing on your to-do list.</div>`
    : `<div class="ios-group">${openTodos.map(todoRowHtml).join('')}</div>`;

  doneZone.innerHTML = doneTodos.length === 0
    ? `<div class="empty">Nothing completed yet.</div>`
    : `<div class="ios-group">${doneTodos.slice().reverse().slice(0, 15).map(todoRowHtml).join('')}</div>`;
}

function renderParkingView() {
  const parkZone = document.getElementById('parkZone');
  if (state.parkingLot.length === 0) {
    parkZone.innerHTML = `<div class="empty">No ideas parked right now.</div>`;
  } else {
    const rows = state.parkingLot.slice().reverse().map(p => {
      if (isEditing('park', p.id)) return `<div class="row">${parkEditFormHtml(p)}</div>`;
      return `
      <div class="row">
        <span class="park-dot"></span>
        <div class="row-main">
          <span class="park-title">${escapeHtml(p.title)}</span>
          <div class="park-actions">
            <button data-action="promote-park-project" data-id="${p.id}">→ Project</button>
            <button data-action="promote-park-todo" data-id="${p.id}">→ To-do</button>
            <button data-action="edit-park" data-id="${p.id}">Edit</button>
            <button class="del" data-action="delete-park" data-id="${p.id}">✕</button>
          </div>
        </div>
      </div>
    `;
    }).join('');
    parkZone.innerHTML = `<div class="ios-group">${rows}</div>`;
  }
}

/* ---- Tab switching ---- */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-' + tab.dataset.view).classList.add('active');
  });

/* ---- Global click handler ----
   Each action performs its Supabase write first, then updates local
   state and re-renders only on success — so the UI never shows a
   change that didn't actually persist. */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;

  // Local-only actions (no DB round trip) — apply immediately.
  switch (action) {
    case 'edit-project': {
      const p = state.projects.find(x => x.id === id);
      editing = { type: 'project', id };
      editingLinksTemp = p && p.links ? JSON.parse(JSON.stringify(p.links)) : [];
      render();
      return;
    }
    case 'edit-todo':
      editing = { type: 'todo', id };
      render();
      return;
    case 'edit-park':
      editing = { type: 'park', id };
      render();
      return;
    case 'cancel-edit':
      editing = null;
      editingLinksTemp = [];
      render();
      return;
    case 'add-edit-link': {
      const form = btn.closest('.add-form');
      const labelInput = form.querySelector('[data-link-field="label"]');
      const urlInput = form.querySelector('[data-link-field="url"]');
      const label = labelInput.value.trim();
      let url = urlInput.value.trim();
      if (label && url) {
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        editingLinksTemp.push({ id: uid(), label, url, _new: true });
      }
      render();
      return;
    }
    case 'remove-edit-link': {
      const idx = parseInt(btn.dataset.index, 10);
      editingLinksTemp.splice(idx, 1);
      render();
      return;
    }
  }

  // DB-backed actions.
  try {
    switch (action) {
      case 'delete': {
        await dbDeleteProject(id);
        state.projects = state.projects.filter(p => p.id !== id);
        break;
      }
      case 'delete-park': {
        await dbDeletePark(id);
        state.parkingLot = state.parkingLot.filter(p => p.id !== id);
        break;
      }
      case 'delete-todo': {
        await dbDeleteTodo(id);
        state.todos = state.todos.filter(t => t.id !== id);
        break;
      }
      case 'done': {
        await dbDeleteProject(id);
        state.projects = state.projects.filter(p => p.id !== id);
        break;
      }
      case 'backlog': {
        const p = state.projects.find(x => x.id === id);
        if (p) {
          const newOrder = nextOrder(state.projects, 'backlog');
          await dbUpdateProject({ ...p, status: 'backlog', order: newOrder });
          p.status = 'backlog'; p.order = newOrder;
        }
        break;
      }
      case 'queue': {
        const p = state.projects.find(x => x.id === id);
        if (p) {
          const newOrder = nextOrder(state.projects, 'queued');
          await dbUpdateProject({ ...p, status: 'queued', order: newOrder });
          p.status = 'queued'; p.order = newOrder;
        }
        break;
      }
      case 'up':
      case 'down': {
        const queued = state.projects.filter(p => p.status === 'queued').sort((a,b) => a.order - b.order);
        const idx = queued.findIndex(p => p.id === id);
        const swapIdx = action === 'up' ? idx - 1 : idx + 1;
        if (swapIdx >= 0 && swapIdx < queued.length) {
          const a = queued[idx], b = queued[swapIdx];
          const aOrder = a.order, bOrder = b.order;
          await Promise.all([
            dbUpdateProject({ ...a, order: bOrder }),
            dbUpdateProject({ ...b, order: aOrder })
          ]);
          a.order = bOrder; b.order = aOrder;
        }
        break;
      }
      case 'toggle-todo': {
        const t = state.todos.find(x => x.id === id);
        if (t) {
          const newDone = !t.done;
          await dbUpdateTodo({ ...t, done: newDone });
          t.done = newDone;
        }
        break;
      }
      case 'star-todo': {
        const t = state.todos.find(x => x.id === id);
        if (t) {
          const newToday = !t.today;
          await dbUpdateTodo({ ...t, today: newToday });
          t.today = newToday;
        }
        break;
      }
      case 'promote-park-project': {
        const idea = state.parkingLot.find(x => x.id === id);
        if (idea) {
          const order = nextOrder(state.projects, 'queued');
          const newProject = { title: idea.title, notes: '', deadline: '', status: 'queued', order };
          const newId = await dbInsertProject(newProject);
          await dbDeletePark(id);
          state.projects.push({ ...newProject, id: newId, links: [] });
          state.parkingLot = state.parkingLot.filter(x => x.id !== id);
        }
        break;
      }
      case 'promote-park-todo': {
        const idea = state.parkingLot.find(x => x.id === id);
        if (idea) {
          const order = nextOrder(state.todos, undefined);
          const newTodo = { title: idea.title, due: '', today: false, done: false, order };
          const newId = await dbInsertTodo(newTodo);
          await dbDeletePark(id);
          state.todos.push({ ...newTodo, id: newId });
          state.parkingLot = state.parkingLot.filter(x => x.id !== id);
        }
        break;
      }
      case 'save-edit-project': {
        const p = state.projects.find(x => x.id === id);
        const form = btn.closest('.add-form');
        if (p && form) {
          const updated = {
            ...p,
            title: form.querySelector('[data-edit-field="title"]').value.trim() || p.title,
            notes: form.querySelector('[data-edit-field="notes"]').value.trim(),
            deadline: form.querySelector('[data-edit-field="deadline"]').value.trim()
          };
          await dbUpdateProject(updated);

          const originalIds = new Set(p.links.map(l => l.id));
          const currentIds = new Set(editingLinksTemp.filter(l => !l._new).map(l => l.id));
          const removed = p.links.filter(l => !currentIds.has(l.id));
          const added = editingLinksTemp.filter(l => l._new);

          await Promise.all(removed.map(l => dbDeleteLink(l.id)));
          const insertedLinks = await Promise.all(added.map(async l => {
            const newId = await dbInsertLink(id, l);
            return { id: newId, label: l.label, url: l.url };
          }));
          const kept = editingLinksTemp.filter(l => !l._new).map(l => ({ id: l.id, label: l.label, url: l.url }));

          updated.links = [...kept, ...insertedLinks];
          Object.assign(p, updated);
        }
        editing = null;
        editingLinksTemp = [];
        break;
      }
      case 'save-edit-todo': {
        const t = state.todos.find(x => x.id === id);
        const form = btn.closest('.add-form');
        if (t && form) {
          const updated = {
            ...t,
            title: form.querySelector('[data-edit-field="title"]').value.trim() || t.title,
            due: form.querySelector('[data-edit-field="due"]').value.trim(),
            today: form.querySelector('[data-edit-field="today"]').checked
          };
          await dbUpdateTodo(updated);
          Object.assign(t, updated);
        }
        editing = null;
        break;
      }
      case 'save-edit-park': {
        const p = state.parkingLot.find(x => x.id === id);
        const form = btn.closest('.add-form');
        if (p && form) {
          const updated = { ...p, title: form.querySelector('[data-edit-field="title"]').value.trim() || p.title };
          await dbUpdatePark(updated);
          Object.assign(p, updated);
        }
        editing = null;
        break;
      }
    }
    setStatus(`synced · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatusError('sync failed', err);
  }

  render();
});

/* ---- Add project form ---- */
document.getElementById('addProjectToggle').addEventListener('click', () => {
  document.getElementById('addProjectForm').classList.remove('hidden');
  document.getElementById('addProjectToggle').classList.add('hidden');
  document.getElementById('newTitle').focus();
});
document.getElementById('cancelAddProject').addEventListener('click', resetProjectForm);
function resetProjectForm() {
  document.getElementById('addProjectForm').classList.add('hidden');
  document.getElementById('addProjectToggle').classList.remove('hidden');
  document.getElementById('newTitle').value = '';
  document.getElementById('newNotes').value = '';
  document.getElementById('newDeadline').value = '';
  pendingNewLinks = [];
  renderNewLinksList();
}

function renderNewLinksList() {
  const list = document.getElementById('newProjectLinksList');
  list.innerHTML = pendingNewLinks.length === 0 ? '' : pendingNewLinks.map((l, i) => `
    <div class="link-editor-item">
      <span class="li-label">${escapeHtml(l.label)}</span>
      <span class="li-url">${escapeHtml(l.url)}</span>
      <button data-remove-new-link="${i}">✕</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-remove-new-link]').forEach(b => {
    b.addEventListener('click', () => {
      pendingNewLinks.splice(parseInt(b.dataset.removeNewLink, 10), 1);
      renderNewLinksList();
    });
  });
}

document.getElementById('addNewLink').addEventListener('click', () => {
  const labelInput = document.getElementById('newLinkLabel');
  const urlInput = document.getElementById('newLinkUrl');
  const label = labelInput.value.trim();
  let url = urlInput.value.trim();
  if (!label || !url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  pendingNewLinks.push({ label, url });
  labelInput.value = '';
  urlInput.value = '';
  renderNewLinksList();
});

document.getElementById('saveAddProject').addEventListener('click', async () => {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) return;
  const notes = document.getElementById('newNotes').value.trim();
  const deadline = document.getElementById('newDeadline').value.trim();
  const status = document.getElementById('newStatus').value;
  const order = nextOrder(state.projects, status);
  const newProject = { title, notes, deadline, status, order };

  try {
    const newId = await dbInsertProject(newProject);
    const insertedLinks = await Promise.all(pendingNewLinks.map(async l => {
      const linkId = await dbInsertLink(newId, l);
      return { id: linkId, label: l.label, url: l.url };
    }));
    state.projects.push({ ...newProject, id: newId, links: insertedLinks });
    setStatus(`synced · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatusError('sync failed', err);
  }
  resetProjectForm();
  render();
});

/* ---- Add todo form ---- */
document.getElementById('addTodoToggle').addEventListener('click', () => {
  document.getElementById('addTodoForm').classList.remove('hidden');
  document.getElementById('addTodoToggle').classList.add('hidden');
  document.getElementById('newTodoTitle').focus();
});
document.getElementById('cancelAddTodo').addEventListener('click', resetTodoForm);
function resetTodoForm() {
  document.getElementById('addTodoForm').classList.add('hidden');
  document.getElementById('addTodoToggle').classList.remove('hidden');
  document.getElementById('newTodoTitle').value = '';
  document.getElementById('newTodoDue').value = '';
  document.getElementById('newTodoToday').checked = false;
}
document.getElementById('saveAddTodo').addEventListener('click', async () => {
  const title = document.getElementById('newTodoTitle').value.trim();
  if (!title) return;
  const due = document.getElementById('newTodoDue').value.trim();
  const today = document.getElementById('newTodoToday').checked;
  const order = state.todos.length;
  const newTodo = { title, due, today, done: false, order };

  try {
    const newId = await dbInsertTodo(newTodo);
    state.todos.push({ ...newTodo, id: newId });
    setStatus(`synced · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatusError('sync failed', err);
  }
  resetTodoForm();
  render();
});

/* ---- Parking lot add ---- */
document.getElementById('parkAdd').addEventListener('click', addParkIdea);
document.getElementById('parkInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') addParkIdea(); });
async function addParkIdea() {
  const input = document.getElementById('parkInput');
  const title = input.value.trim();
  if (!title) return;
  input.value = '';
  try {
    const { id, addedDate } = await dbInsertPark(title);
    state.parkingLot.push({ id, title, addedDate });
    setStatus(`synced · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatusError('sync failed', err);
  }
  render();
}

/* ---- Auth ---- */

document.getElementById('authSend').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const msg = document.getElementById('authMsg');
  if (!email) return;
  msg.textContent = 'sending...';
  const { error } = await supabaseClient.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  msg.textContent = error ? `error: ${error.message}` : 'check your email for the sign-in link.';
});

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
});

async function showApp() {
  document.getElementById('authGate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  setStatus('syncing...');
  try {
    await loadAll();
  } catch (err) {
    setStatusError('could not load your data', err);
  }
  render();
}

function showAuthGate() {
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authGate').classList.remove('hidden');
  loaded = false;
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (session) {
    showApp();
  } else {
    showAuthGate();
  }
});
</script>
