<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312161d'/%3E%3Crect x='6' y='6' width='20' height='20' rx='3' fill='none' stroke='%232a3340' stroke-width='1.5'/%3E%3Cpath d='M9.5 11.5l2 2 3.5-4' stroke='%234fb0a5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cline x1='17' y1='12' x2='23' y2='12' stroke='%238b96a5' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M9.5 18.5l2 2 3.5-4' stroke='%23e8a33d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cline x1='17' y1='19' x2='23' y2='19' stroke='%238b96a5' stroke-width='1.6' stroke-linecap='round'/%3E%3Cline x1='9.5' y1='25' x2='16' y2='25' stroke='%23565f6b' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #12161d;
    --panel: #1a2028;
    --panel-raised: #202834;
    --line: #2a3340;
    --text: #e4e8ee;
    --text-dim: #8b96a5;
    --text-faint: #565f6b;
    --amber: #e8a33d;
    --amber-dim: #6b4f20;
    --teal: #4fb0a5;
    --teal-dim: #234943;
    --violet: #9d8cd6;
    --violet-dim: #3c3564;
    --gray: #5b6572;
    --red: #d6644f;
    --mono: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  #app {
    max-width: 680px;
    margin: 0 auto;
    padding: 20px 16px 80px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }

  .brand h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0;
    color: var(--text);
  }

  .brand .tick {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  header .count { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); text-align: right; line-height: 1.5; }

  .signout {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    background: transparent;
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 5px;
    margin-top: 4px;
  }
  .signout:hover { color: var(--red); border-color: var(--red); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 4px;
    margin-bottom: 22px;
  }

  .tab {
    flex: 1;
    background: transparent;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 9px 6px;
    border-radius: 6px;
    text-align: center;
    transition: all 0.15s ease;
  }

  .tab.active { background: var(--panel-raised); color: var(--text); }
  .tab:hover:not(.active) { color: var(--text-dim); }

  .view { display: none; }
  .view.active { display: block; }

  .section-label {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 28px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .section-label:first-of-type { margin-top: 0; }

  /* ---- Today / focus summary (on Today tab) ---- */
  .focus-card {
    background: linear-gradient(155deg, var(--panel-raised), var(--panel));
    border: 1px solid var(--amber-dim);
    border-radius: 10px;
    padding: 18px 18px 16px;
    position: relative;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .focus-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--amber); }

  .focus-tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
  }

  .focus-card h2 { margin: 0 0 6px; font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .focus-card .notes { font-size: 13.5px; color: var(--text-dim); line-height: 1.5; margin: 8px 0 14px; }

  .deadline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--amber);
    background: rgba(232, 163, 61, 0.1);
    border: 1px solid var(--amber-dim);
    padding: 3px 9px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  .focus-actions { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }

  button { font-family: var(--sans); cursor: pointer; border: none; outline: none; }

  .btn {
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 7px;
    background: var(--panel-raised);
    color: var(--text-dim);
    border: 1px solid var(--line);
    transition: all 0.15s ease;
  }

  .btn:hover { color: var(--text); border-color: var(--gray); }
  .btn.primary { background: var(--amber); color: #221605; border-color: var(--amber); }
  .btn.primary:hover { background: #f0ad4d; }
  .btn.teal { background: var(--teal); color: #06231f; border-color: var(--teal); }
  .btn.teal:hover { background: #63c2b7; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-faint); padding: 8px 10px; }
  .btn.ghost:hover { color: var(--red); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { box-shadow: 0 0 0 2px var(--amber); }

  /* ---- Queue list (projects) ---- */
  .queue-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 12px 12px 10px;
    margin-bottom: 8px;
  }

  .q-num { font-family: var(--mono); font-size: 11px; color: var(--text-faint); padding-top: 2px; min-width: 26px; }
  .q-body { flex: 1; min-width: 0; }
  .q-title { font-size: 14.5px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .q-notes { font-size: 12.5px; color: var(--text-dim); line-height: 1.4; }
  .q-deadline { font-family: var(--mono); font-size: 10.5px; color: var(--teal); margin-top: 4px; display: inline-block; }

  .q-controls { display: flex; flex-direction: column; gap: 2px; }
  .q-controls button { background: transparent; color: var(--text-faint); padding: 2px 6px; border-radius: 4px; font-size: 13px; line-height: 1; }
  .q-controls button:hover { color: var(--text); background: var(--panel-raised); }

  .q-actions-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .q-actions-row button {
    font-family: var(--mono);
    font-size: 10.5px;
    background: transparent;
    color: var(--text-faint);
    padding: 4px 8px;
    border-radius: 5px;
    border: 1px solid var(--line);
  }
  .q-actions-row button:hover { color: var(--text); border-color: var(--gray); }

  .backlog-item { opacity: 0.7; }
  .backlog-item .q-title { color: var(--text-dim); }

  /* ---- To-dos ---- */
  .todo-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    margin-bottom: 7px;
  }

  .todo-check {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--gray);
    background: transparent;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: transparent;
    font-size: 12px;
  }

  .todo-check.checked { background: var(--teal); border-color: var(--teal); color: #06231f; }

  .todo-body { flex: 1; min-width: 0; }
  .todo-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .todo-item.done .todo-title { color: var(--text-faint); text-decoration: line-through; }
  .todo-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }

  .todo-due {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--violet);
    background: rgba(157, 140, 214, 0.12);
    border: 1px solid var(--violet-dim);
    padding: 2px 7px;
    border-radius: 12px;
  }

  .todo-today-badge {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--amber);
    background: rgba(232, 163, 61, 0.12);
    border: 1px solid var(--amber-dim);
    padding: 2px 7px;
    border-radius: 12px;
  }

  .todo-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .todo-actions button {
    background: transparent;
    color: var(--text-faint);
    padding: 4px 7px;
    border-radius: 5px;
    font-size: 11px;
    font-family: var(--mono);
    border: 1px solid var(--line);
  }
  .todo-actions button:hover { color: var(--text); border-color: var(--gray); }
  .todo-actions button.star.active { color: var(--amber); border-color: var(--amber-dim); }
  .todo-actions button.del:hover { color: var(--red); }

  /* ---- Parking lot ---- */
  .park-form { display: flex; gap: 8px; margin-bottom: 12px; }
  .park-form input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 7px;
    font-size: 13.5px;
    font-family: var(--sans);
  }
  .park-form input::placeholder { color: var(--text-faint); }

  .park-item { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .park-item:last-child { border-bottom: none; }
  .park-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gray); flex-shrink: 0; }
  .park-title { flex: 1; font-size: 13.5px; color: var(--text-dim); }
  .park-actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .park-actions button {
    font-family: var(--mono);
    font-size: 10px;
    background: transparent;
    color: var(--text-faint);
    padding: 4px 8px;
    border-radius: 5px;
    border: 1px solid var(--line);
  }
  .park-actions button:hover { color: var(--teal); border-color: var(--teal-dim); }
  .park-actions button.del:hover { color: var(--red); }

  .empty {
    font-size: 13px;
    color: var(--text-faint);
    padding: 16px 4px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }

  /* ---- Add forms ---- */
  .add-form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 8px; }
  .add-form.hidden { display: none; }
  .add-form input, .add-form textarea {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 13.5px;
    font-family: var(--sans);
    margin-bottom: 8px;
  }
  .add-form textarea { resize: vertical; min-height: 50px; }
  .add-form .row { display: flex; gap: 8px; }
  .add-form .row > * { flex: 1; }
  .add-form .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .add-form label.check-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); margin-bottom: 8px; }

  .add-toggle {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--text-faint);
    padding: 10px;
    border-radius: 8px;
    font-size: 12.5px;
    font-family: var(--mono);
    letter-spacing: 0.04em;
    margin-top: 8px;
  }
  .add-toggle:hover { color: var(--text-dim); border-color: var(--gray); }
  .add-toggle.hidden { display: none; }

  .status-msg { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); text-align: center; margin-top: 30px; }

  select {
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-family: var(--sans);
  }

  /* ---- Link pills ---- */
  .link-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0 4px;
  }

  .link-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--teal);
    background: rgba(79, 176, 165, 0.1);
    border: 1px solid var(--teal-dim);
    padding: 4px 10px;
    border-radius: 20px;
    text-decoration: none;
    max-width: 100%;
  }

  .link-pill span.lbl {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 160px;
  }

  .link-pill:hover { background: rgba(79, 176, 165, 0.2); }

  /* ---- Link editor (inside add/edit forms) ---- */
  .link-editor { margin-bottom: 8px; }

  .link-editor-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }

  .link-editor-list { margin-bottom: 6px; }

  .link-editor-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    margin-bottom: 5px;
  }

  .link-editor-item .li-label { font-size: 12.5px; color: var(--text); font-weight: 600; flex-shrink: 0; }
  .link-editor-item .li-url { font-size: 11.5px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .link-editor-item button { background: transparent; color: var(--text-faint); font-size: 12px; padding: 2px 6px; border-radius: 4px; }
  .link-editor-item button:hover { color: var(--red); }

  .link-editor-add { display: flex; gap: 6px; }
  .link-editor-add input { margin-bottom: 0; }
  .link-editor-add input[data-link-field="label"] { flex: 0 0 110px; }
  .link-editor-add input[data-link-field="url"] { flex: 1; }
  .link-editor-add button {
    flex-shrink: 0;
    background: var(--panel-raised);
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 12px;
    font-size: 12px;
  }
  .link-editor-add button:hover { color: var(--text); border-color: var(--gray); }

  /* ---- Auth gate ---- */
  #authGate {
    max-width: 360px;
    margin: 18vh auto 0;
    padding: 0 16px;
    text-align: center;
  }
  #authGate h1 {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  #authGate input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 12px;
    border-radius: 7px;
    font-size: 14px;
    font-family: var(--sans);
    margin-bottom: 10px;
  }
  #authGate .btn { width: 100%; padding: 10px; }
  #authGate .auth-msg { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-top: 14px; min-height: 1.4em; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="authGate">
  <h1>Queue</h1>
  <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
  <button class="btn primary" id="authSend">Send magic link</button>
  <div class="auth-msg" id="authMsg"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">
      <span class="tick"></span>
      <h1>Queue</h1>
    </div>
    <div style="text-align:right;">
      <span class="count" id="headerCount">—</span><br>
      <button class="signout" id="signOutBtn">sign out</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="today">Today</button>
    <button class="tab" data-view="projects">Projects</button>
    <button class="tab" data-view="todos">To-Dos</button>
    <button class="tab" data-view="parking">Parking</button>
  </div>

  <!-- TODAY VIEW -->
  <div class="view active" id="view-today">
    <div class="section-label">Top Priority Project</div>
    <div id="todayFocusZone"></div>

    <div class="section-label">Flagged For Today</div>
    <div id="todayTodoZone"></div>
  </div>

  <!-- PROJECTS VIEW -->
  <div class="view" id="view-projects">
    <div class="section-label">Up Now</div>
    <div id="focusZone"></div>

    <div class="section-label">On Deck</div>
    <div id="queueZone"></div>

    <button class="add-toggle" id="addProjectToggle">+ add a project</button>
    <div class="add-form hidden" id="addProjectForm">
      <input type="text" id="newTitle" placeholder="Project name">
      <textarea id="newNotes" placeholder="Notes (optional)"></textarea>
      <div class="row">
        <input type="text" id="newDeadline" placeholder="Deadline (optional, e.g. Aug 25)">
        <select id="newStatus">
          <option value="queued">Add to queue</option>
          <option value="backlog">Add to backlog</option>
        </select>
      </div>
      <div class="link-editor">
        <div class="link-editor-label">Links</div>
        <div class="link-editor-list" id="newProjectLinksList"></div>
        <div class="link-editor-add">
          <input type="text" id="newLinkLabel" placeholder="Label (e.g. Sheet)">
          <input type="text" id="newLinkUrl" placeholder="https://...">
          <button id="addNewLink" type="button">+ Add</button>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn" id="cancelAddProject">Cancel</button>
        <button class="btn primary" id="saveAddProject">Add project</button>
      </div>
    </div>

    <div class="section-label">Backlog</div>
    <div id="backlogZone"></div>
  </div>

  <!-- TODOS VIEW -->
  <div class="view" id="view-todos">
    <div class="section-label">Open</div>
    <div id="todoOpenZone"></div>

    <button class="add-toggle" id="addTodoToggle">+ add a to-do</button>
    <div class="add-form hidden" id="addTodoForm">
      <input type="text" id="newTodoTitle" placeholder="e.g. Mow the grass, go to the DMV">
      <div class="row">
        <input type="text" id="newTodoDue" placeholder="Due (optional, e.g. Fri)">
      </div>
      <label class="check-row"><input type="checkbox" id="newTodoToday"> Flag as today</label>
      <div class="form-actions">
        <button class="btn" id="cancelAddTodo">Cancel</button>
        <button class="btn primary" id="saveAddTodo">Add to-do</button>
      </div>
    </div>

    <div class="section-label">Done</div>
    <div id="todoDoneZone"></div>
  </div>

  <!-- PARKING LOT VIEW -->
  <div class="view" id="view-parking">
    <div class="section-label">Capture a new idea</div>
    <div class="park-form">
      <input type="text" id="parkInput" placeholder="Jot it down before it slips away...">
      <button class="btn primary" id="parkAdd">Add</button>
    </div>
    <div id="parkZone"></div>
  </div>

  <div class="status-msg" id="statusMsg">syncing...</div>
</div>

<script>
/* ============================================================
   CONFIG — fill these in from Supabase → Settings → API
   ============================================================ */
const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let state = { projects: [], todos: [], parkingLot: [] };
let loaded = false;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function setStatus(text) {
  document.getElementById('statusMsg').textContent = text;
}

function setStatusError(prefix, err) {
  const msg = (err && err.message) ? err.message : (typeof err === 'string' ? err : JSON.stringify(err));
  document.getElementById('statusMsg').innerHTML =
    `${escapeHtml(prefix)}: ${escapeHtml(msg)} — <button id="retryLoadBtn" style="background:transparent;border:1px solid var(--line);color:var(--amber);font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:5px;">retry</button>`;
  const retryBtn = document.getElementById('retryLoadBtn');
  if (retryBtn) retryBtn.addEventListener('click', () => { loadAll().then(render); });
}

function nextOrder(list, status) {
  const items = status === undefined ? list : list.filter(p => p.status === status);
  return items.length ? Math.max(...items.map(p => p.order)) + 1 : 0;
}

/* ---- Data layer (Supabase) ---- */

async function loadAll() {
  const [projectsRes, linksRes, todosRes, parkRes] = await Promise.all([
    supabaseClient.from('projects').select('*').order('order_index'),
    supabaseClient.from('project_links').select('*').order('order_index'),
    supabaseClient.from('todos').select('*').order('order_index'),
    supabaseClient.from('parking_lot').select('*').order('created_at')
  ]);
  for (const r of [projectsRes, linksRes, todosRes, parkRes]) {
    if (r.error) throw r.error;
  }

  const linksByProject = {};
  linksRes.data.forEach(l => {
    (linksByProject[l.project_id] ||= []).push({ id: l.id, label: l.label, url: l.url });
  });

  state = {
    projects: projectsRes.data.map(p => ({
      id: p.id, title: p.title, notes: p.notes || '', deadline: p.deadline || '',
      status: p.status, order: p.order_index, links: linksByProject[p.id] || []
    })),
    todos: todosRes.data.map(t => ({
      id: t.id, title: t.title, due: t.due || '', today: t.today, done: t.done, order: t.order_index
    })),
    parkingLot: parkRes.data.map(p => ({ id: p.id, title: p.title, addedDate: p.created_at }))
  };
  loaded = true;
  setStatus(`synced · ${new Date().toLocaleTimeString()}`);
}

  const openTodos = state.todos.filter(t => !t.done).sort((a,b) => (b.today - a.today) || (a.order - b.order));

/* ---- Global click handler ----
   Each action performs its Supabase write first, then updates local
   state and re-renders only on success — so the UI never shows a
   change that didn't actually persist. */
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;

  // Local-only actions (no DB round trip) — apply immediately.
  switch (action) {
    case 'edit-project': {
      const p = state.projects.find(x => x.id === id);
      editing = { type: 'project', id };
      editingLinksTemp = p && p.links ? JSON.parse(JSON.stringify(p.links)) : [];
      render();
      return;
    }
    case 'edit-todo':
      editing = { type: 'todo', id };
      render();
      return;
    case 'edit-park':
      editing = { type: 'park', id };
      render();
      return;
    case 'cancel-edit':
      editing = null;
      editingLinksTemp = [];
      render();
      return;
    case 'add-edit-link': {
      const form = btn.closest('.add-form');
      const labelInput = form.querySelector('[data-link-field="label"]');
      const urlInput = form.querySelector('[data-link-field="url"]');
      const label = labelInput.value.trim();
      let url = urlInput.value.trim();
      if (label && url) {
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        editingLinksTemp.push({ id: uid(), label, url, _new: true });
      }
      render();
      return;
    }
    case 'remove-edit-link': {
      const idx = parseInt(btn.dataset.index, 10);
      editingLinksTemp.splice(idx, 1);
      render();
      return;
    }
  }

  // DB-backed actions.
  try {
    switch (action) {
      case 'delete': {
        await dbDeleteProject(id);
        state.projects = state.projects.filter(p => p.id !== id);
        break;
      }
      case 'delete-park': {
        await dbDeletePark(id);
        state.parkingLot = state.parkingLot.filter(p => p.id !== id);
        break;
      }
      case 'delete-todo': {
        await dbDeleteTodo(id);
        state.todos = state.todos.filter(t => t.id !== id);
        break;
      }
      case 'done': {
        await dbDeleteProject(id);
        state.projects = state.projects.filter(p => p.id !== id);
        break;
      }
      case 'backlog': {
        const p = state.projects.find(x => x.id === id);
        if (p) {
          const newOrder = nextOrder(state.projects, 'backlog');
          await dbUpdateProject({ ...p, status: 'backlog', order: newOrder });
          p.status = 'backlog'; p.order = newOrder;
        }
        break;
      }
      case 'queue': {
        const p = state.projects.find(x => x.id === id);
        if (p) {
          const newOrder = nextOrder(state.projects, 'queued');
          await dbUpdateProject({ ...p, status: 'queued', order: newOrder });
          p.status = 'queued'; p.order = newOrder;
        }
        break;
      }
      case 'up':
      case 'down': {
        const queued = state.projects.filter(p => p.status === 'queued').sort((a,b) => a.order - b.order);
        const idx = queued.findIndex(p => p.id === id);
        const swapIdx = action === 'up' ? idx - 1 : idx + 1;
        if (swapIdx >= 0 && swapIdx < queued.length) {
          const a = queued[idx], b = queued[swapIdx];
          const aOrder = a.order, bOrder = b.order;
          await Promise.all([
            dbUpdateProject({ ...a, order: bOrder }),
            dbUpdateProject({ ...b, order: aOrder })
          ]);
          a.order = bOrder; b.order = aOrder;
        }
        break;
      }
      case 'toggle-todo': {
        const t = state.todos.find(x => x.id === id);
        if (t) {
          const newDone = !t.done;
          await dbUpdateTodo({ ...t, done: newDone });
          t.done = newDone;
        }
        break;
      }
      case 'star-todo': {
        const t = state.todos.find(x => x.id === id);
        if (t) {
          const newToday = !t.today;
          await dbUpdateTodo({ ...t, today: newToday });
          t.today = newToday;
        }
        break;
      }
      case 'promote-park-project': {
        const idea = state.parkingLot.find(x => x.id === id);
        if (idea) {
          const order = nextOrder(state.projects, 'queued');
          const newProject = { title: idea.title, notes: '', deadline: '', status: 'queued', order };
          const newId = await dbInsertProject(newProject);
          await dbDeletePark(id);
          state.projects.push({ ...newProject, id: newId, links: [] });
          state.parkingLot = state.parkingLot.filter(x => x.id !== id);
        }
        break;
      }
      case 'promote-park-todo': {
        const idea = state.parkingLot.find(x => x.id === id);
        if (idea) {
          const order = nextOrder(state.todos, undefined);
          const newTodo = { title: idea.title, due: '', today: false, done: false, order };
          const newId = await dbInsertTodo(newTodo);
          await dbDeletePark(id);
          state.todos.push({ ...newTodo, id: newId });
          state.parkingLot = state.parkingLot.filter(x => x.id !== id);
        }
        break;
      }
      case 'save-edit-project': {
        const p = state.projects.find(x => x.id === id);
        const form = btn.closest('.add-form');
        if (p && form) {
          const updated = {
            ...p,
            title: form.querySelector('[data-edit-field="title"]').value.trim() || p.title,
            notes: form.querySelector('[data-edit-field="notes"]').value.trim(),
            deadline: form.querySelector('[data-edit-field="deadline"]').value.trim()
          };
          await dbUpdateProject(updated);

          const originalIds = new Set(p.links.map(l => l.id));
          const currentIds = new Set(editingLinksTemp.filter(l => !l._new).map(l => l.id));
          const removed = p.links.filter(l => !currentIds.has(l.id));
          const added = editingLinksTemp.filter(l => l._new);

          await Promise.all(removed.map(l => dbDeleteLink(l.id)));
          const insertedLinks = await Promise.all(added.map(async l => {
            const newId = await dbInsertLink(id, l);
            return { id: newId, label: l.label, url: l.url };
          }));
          const kept = editingLinksTemp.filter(l => !l._new).map(l => ({ id: l.id, label: l.label, url: l.url }));

          updated.links = [...kept, ...insertedLinks];
          Object.assign(p, updated);
        }
        editing = null;
        editingLinksTemp = [];
        break;
      }
      case 'save-edit-todo': {
        const t = state.todos.find(x => x.id === id);
        const form = btn.closest('.add-form');
        if (t && form) {
          const updated = {
            ...t,
            title: form.querySelector('[data-edit-field="title"]').value.trim() || t.title,
            due: form.querySelector('[data-edit-field="due"]').value.trim(),
            today: form.querySelector('[data-edit-field="today"]').checked
          };
          await dbUpdateTodo(updated);
          Object.assign(t, updated);
        }
        editing = null;
        break;
      }
      case 'save-edit-park': {
        const p = state.parkingLot.find(x => x.id === id);
        const form = btn.closest('.add-form');
        if (p && form) {
          const updated = { ...p, title: form.querySelector('[data-edit-field="title"]').value.trim() || p.title };
          await dbUpdatePark(updated);
          Object.assign(p, updated);
        }
        editing = null;
        break;
      }
    }
    setStatus(`synced · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatusError('sync failed', err);
  }

  render();
});

function resetProjectForm() {
  document.getElementById('addProjectForm').classList.add('hidden');
  document.getElementById('addProjectToggle').classList.remove('hidden');
  document.getElementById('newTitle').value = '';
  document.getElementById('newNotes').value = '';
  document.getElementById('newDeadline').value = '';
  pendingNewLinks = [];
  renderNewLinksList();
}

function renderNewLinksList() {
  const list = document.getElementById('newProjectLinksList');
  list.innerHTML = pendingNewLinks.length === 0 ? '' : pendingNewLinks.map((l, i) => `
    <div class="link-editor-item">
      <span class="li-label">${escapeHtml(l.label)}</span>
      <span class="li-url">${escapeHtml(l.url)}</span>
      <button data-remove-new-link="${i}">✕</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-remove-new-link]').forEach(b => {
    b.addEventListener('click', () => {
      pendingNewLinks.splice(parseInt(b.dataset.removeNewLink, 10), 1);
      renderNewLinksList();
    });
  });
}

document.getElementById('addNewLink').addEventListener('click', () => {
  const labelInput = document.getElementById('newLinkLabel');
  const urlInput = document.getElementById('newLinkUrl');
  const label = labelInput.value.trim();
  let url = urlInput.value.trim();
  if (!label || !url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  pendingNewLinks.push({ label, url });
  labelInput.value = '';
  urlInput.value = '';
  renderNewLinksList();
});

document.getElementById('saveAddProject').addEventListener('click', async () => {
  const title = document.getElementById('newTitle').value.trim();
  if (!title) return;
  const notes = document.getElementById('newNotes').value.trim();
  const deadline = document.getElementById('newDeadline').value.trim();
  const status = document.getElementById('newStatus').value;
  const order = nextOrder(state.projects, status);
  const newProject = { title, notes, deadline, status, order };

  try {
    const newId = await dbInsertProject(newProject);
    const insertedLinks = await Promise.all(pendingNewLinks.map(async l => {
      const linkId = await dbInsertLink(newId, l);
      return { id: linkId, label: l.label, url: l.url };
    }));
    state.projects.push({ ...newProject, id: newId, links: insertedLinks });
    setStatus(`synced · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatusError('sync failed', err);
  }
  resetProjectForm();
  render();
});

/* ---- Add todo form ---- */
document.getElementById('addTodoToggle').addEventListener('click', () => {
  document.getElementById('addTodoForm').classList.remove('hidden');
  document.getElementById('addTodoToggle').classList.add('hidden');
  document.getElementById('newTodoTitle').focus();
});
document.getElementById('cancelAddTodo').addEventListener('click', resetTodoForm);
function resetTodoForm() {
  document.getElementById('addTodoForm').classList.add('hidden');
  document.getElementById('addTodoToggle').classList.remove('hidden');
  document.getElementById('newTodoTitle').value = '';
  document.getElementById('newTodoDue').value = '';
  document.getElementById('newTodoToday').checked = false;
}
document.getElementById('saveAddTodo').addEventListener('click', async () => {
  const title = document.getElementById('newTodoTitle').value.trim();
  if (!title) return;
  const due = document.getElementById('newTodoDue').value.trim();
  const today = document.getElementById('newTodoToday').checked;
  const order = state.todos.length;
  const newTodo = { title, due, today, done: false, order };

  try {
    const newId = await dbInsertTodo(newTodo);
    state.todos.push({ ...newTodo, id: newId });
    setStatus(`synced · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatusError('sync failed', err);
  }
  resetTodoForm();
  render();
});

/* ---- Parking lot add ---- */
document.getElementById('parkAdd').addEventListener('click', addParkIdea);
document.getElementById('parkInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') addParkIdea(); });
async function addParkIdea() {
  const input = document.getElementById('parkInput');
  const title = input.value.trim();
  if (!title) return;
  input.value = '';
  try {
    const { id, addedDate } = await dbInsertPark(title);
    state.parkingLot.push({ id, title, addedDate });
    setStatus(`synced · ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatusError('sync failed', err);
  }
  render();
}

/* ---- Auth ---- */

document.getElementById('authSend').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const msg = document.getElementById('authMsg');
  if (!email) return;
  msg.textContent = 'sending...';
  const { error } = await supabaseClient.auth.signInWithOtp({ email });
  msg.textContent = error ? `error: ${error.message}` : 'check your email for the sign-in link.';
});

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
});

async function showApp() {
  document.getElementById('authGate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  setStatus('syncing...');
  try {
    await loadAll();
  } catch (err) {
    setStatusError('could not load your data', err);
  }
  render();
}

function showAuthGate() {
  document.getElementById('app').classList.add('hidden');
  document.getElementById('authGate').classList.remove('hidden');
  loaded = false;
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (session) {
    showApp();
  } else {
    showAuthGate();
  }
});
</script>
